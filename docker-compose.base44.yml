services:
  backend:
    image: node:22
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_data:/app/data
    command: ["sh", "-ec", "npm install && exec npm run dev"]
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CORS_ORIGIN=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8000/api/health',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure

  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["sh", "-ec", "npm install && exec npm run dev"]
    ports:
      - "3000:5173"
    environment:
      - VITE_API_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5173/',res=>process.exit(res.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure

volumes:
  backend_node_modules:
  backend_data:
  frontend_node_modules:
